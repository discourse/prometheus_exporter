name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * 0" # weekly

permissions:
  contents: write
  packages: write

env:
  DOCKER_REPO: ghcr.io/discourse/prometheus_exporter

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} AR ${{ matrix.activerecord }}
    timeout-minutes: 10

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/ar_${{ matrix.activerecord }}.gemfile

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        activerecord: [71, 72, 80, 81]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: latest
          bundler-cache: true

      - name: Run tests
        run: bin/rake

  puma-api:
    runs-on: ubuntu-latest
    name: Puma ${{ matrix.puma }} API
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        puma: ["6.4.3", "7.2.1", "8.0.2"]

    env:
      PUMA_VERSION: ${{ matrix.puma }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler: latest
          bundler-cache: true
          cache-version: puma-${{ matrix.puma }}

      - name: Verify embedded server and wire behavior
        run: bin/rake test

  package-smoke:
    runs-on: ubuntu-latest
    name: Isolated built gem load
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler: latest
          bundler-cache: true

      - name: Build, install, and load the gem in isolation
        run: bin/rake package_smoke

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, puma-api, package-smoke]
    runs-on: ubuntu-latest

    outputs:
      new_version_published: ${{ steps.release.outputs.new_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Release gem
        id: release
        uses: discourse/publish-rubygems-action@v2
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
          GIT_EMAIL: team@discourse.org
          GIT_NAME: discoursebot

  publish_docker:
    needs: publish
    if: needs.publish.outputs.new_version_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v2
      - uses: docker/setup-buildx-action@v2

      - name: Set vars
        id: vars
        run: |
          ruby -r ./lib/prometheus_exporter/version.rb -e 'print "version=#{PrometheusExporter::VERSION}"' >> $GITHUB_OUTPUT

      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GEM_VERSION=${{ steps.vars.outputs.version }}
          tags: |
            ${{ env.DOCKER_REPO }}:${{ steps.vars.outputs.version }}
            ${{ env.DOCKER_REPO }}:latest
